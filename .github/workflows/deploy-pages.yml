name: Deploy to GitHub Pages
 
on:
  push:
    branches: [main]
  # Lets you trigger a re-deploy manually from the Actions tab without a new commit.
  workflow_dispatch:
 
# Only one deployment at a time; a new push cancels an in-flight one instead of queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build
        run: npm run build
 
      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
